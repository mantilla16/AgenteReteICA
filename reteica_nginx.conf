server {
    listen 80;
    server_name tu_dominio.com;  # Cambiar por tu dominio o IP

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe ir a la par del timeout de gunicorn: con el modelo local en CPU
        # una revision tarda minutos, y si nginx corta antes, el auditor ve un
        # 504 aunque el motor siga trabajando.
        proxy_read_timeout 1500s;
        proxy_send_timeout 1500s;
        proxy_connect_timeout 10s;
    }

    location /descargar/ {
        proxy_pass http://127.0.0.1:8000/descargar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition $upstream_http_contentDisposition always;
    }
}
