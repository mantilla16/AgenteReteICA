name: CI

# Corre la suite de pruebas del motor en cada push a main y en cada Pull
# Request. Es la red de seguridad: si un cambio rompe alguno de los ~500 tests,
# GitHub lo marca en rojo antes de que llegue a produccion.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

jobs:
  pruebas:
    # Corre en la nube de GitHub (gratis, sin servidor propio). Estas pruebas no
    # necesitan la red interna, asi que la nube alcanza. Para usar TU runner del
    # servidor: registralo en Settings > Actions > Runners de este repo y cambia
    # esta linea por:  runs-on: self-hosted
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Correr las pruebas
        run: pytest -q

  deploy:
    # Despliega en el servidor de produccion. CANDADO: 'needs: pruebas' hace que
    # este job SOLO corra si las pruebas pasaron verde -- nunca se despliega
    # codigo roto. Y solo en push a main (no en Pull Requests).
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Corre en el runner self-hosted del propio servidor. Ese runner ejecuta el
    # script root-owned /usr/local/bin/reteica-deploy (git pull + pip + restart)
    # via una regla de sudo puntual y sin contraseña.
    runs-on: self-hosted
    steps:
      - name: Actualizar y reiniciar la app
        run: sudo /usr/local/bin/reteica-deploy
